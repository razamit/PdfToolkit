<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="7" fill="#4f46e5" />

  <!-- Large cog, centred at (13,13). Teeth are one set of four rects drawn
       twice, the second rotated 45deg, giving eight evenly spaced teeth. -->
  <g fill="#ffffff">
    <circle cx="13" cy="13" r="6" />
    <g>
      <rect x="11.6" y="4.8" width="2.8" height="3.2" rx="0.6" />
      <rect x="11.6" y="18" width="2.8" height="3.2" rx="0.6" />
      <rect x="4.8" y="11.6" width="3.2" height="2.8" rx="0.6" />
      <rect x="18" y="11.6" width="3.2" height="2.8" rx="0.6" />
    </g>
    <g transform="rotate(45 13 13)">
      <rect x="11.6" y="4.8" width="2.8" height="3.2" rx="0.6" />
      <rect x="11.6" y="18" width="2.8" height="3.2" rx="0.6" />
      <rect x="4.8" y="11.6" width="3.2" height="2.8" rx="0.6" />
      <rect x="18" y="11.6" width="3.2" height="2.8" rx="0.6" />
    </g>
  </g>
  <circle cx="13" cy="13" r="2.3" fill="#4f46e5" />

  <!-- Small meshed cog, centred at (23,23). -->
  <g fill="#c7d2fe">
    <circle cx="23" cy="23" r="3.6" />
    <g>
      <rect x="22" y="18.6" width="2" height="2.2" rx="0.5" />
      <rect x="22" y="25.2" width="2" height="2.2" rx="0.5" />
      <rect x="18.6" y="22" width="2.2" height="2" rx="0.5" />
      <rect x="25.2" y="22" width="2.2" height="2" rx="0.5" />
    </g>
    <g transform="rotate(45 23 23)">
      <rect x="22" y="18.6" width="2" height="2.2" rx="0.5" />
      <rect x="22" y="25.2" width="2" height="2.2" rx="0.5" />
      <rect x="18.6" y="22" width="2.2" height="2" rx="0.5" />
      <rect x="25.2" y="22" width="2.2" height="2" rx="0.5" />
    </g>
  </g>
  <circle cx="23" cy="23" r="1.4" fill="#4f46e5" />
</svg>
