[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Send the Netlify subdomain to the canonical host. Netlify auto-redirects domain
# *aliases* to the primary domain but never the .netlify.app subdomain, which stays
# publicly reachable regardless — so without this rule the site answers on two
# hostnames and splits its own SEO signal. Declared first because a host-level rule
# has to outrank the path-level ones; `force` is required because a redirect
# otherwise loses to a matching static file, and index.html matches every path.
[[redirects]]
  from = "https://pdfedittoolkit.netlify.app/*"
  to = "https://freepdfmachine.com/:splat"
  status = 301
  force = true

# Public usage counters. These routes must stay ahead of any future SPA rewrite,
# or that rewrite would serve index.html instead of reaching the functions.
[[redirects]]
  from = "/api/usage/history"
  to = "/.netlify/functions/usage-history"
  status = 200

[[redirects]]
  from = "/api/usage"
  to = "/.netlify/functions/usage-counters"
  status = 200

# The browser posts one event name here on each tracked action; the function
# increments the shared totals blob that /api/usage reads back.
[[redirects]]
  from = "/api/track"
  to = "/.netlify/functions/track-usage"
  status = 200

# NO SPA CATCH-ALL. This is deliberate, and the absence is load-bearing — see
# decision row 22.
#
# There used to be a `/*` -> `/index.html` rewrite here. The app has no
# client-side router (nothing in src/ imports react-router, calls useNavigate, or
# touches history.pushState), so it bought nothing, while making EVERY path on
# the domain answer 200 with the app shell. That turned vulnerability scanners
# probing /wp-admin/install.php and /xmlrpc.php into recorded pageviews and made
# every mistyped URL an indexable soft-404.
#
# Without it, Netlify serves the site the ordinary static way: / gets index.html,
# real files win on their own paths, and anything else falls through to
# public/404.html with a genuine 404 status.
#
# Restoring a catch-all is what a future session will be tempted to do the first
# time this app gains client-side routes. Read decision row 22 before doing it:
# the fix then is a rule scoped to the real route paths, never `/*`, and NEVER
# with `force = true` — a forced rewrite beats static files, which would swallow
# /robots.txt, /sitemap.xml, /llms.txt, /llms-full.txt, /index.md and
# /.well-known/agent-card.json and answer all six with HTML.

# ---------------------------------------------------------------------------
# Headers
# ---------------------------------------------------------------------------

# Applies to every response. The Link header is the agent-discovery entry point:
# a crawler that fetches any URL learns where the sitemap and the plain-text
# briefing live without having to guess at conventional paths.
[[headers]]
  for = "/*"
  [headers.values]
    Link = '</sitemap.xml>; rel="sitemap", </llms.txt>; rel="describedby"'
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Vite content-hashes every filename under /assets, so the bytes behind a given
# URL can never change. Serving them with the default max-age=0 revalidated a
# 1.4 MB bundle on every visit for no benefit.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The browser must revalidate these two PWA control files on every visit. The
# worker itself versions and retires application caches after it sees a change.
[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "no-cache"

# The bundled annotation font is NOT content-hashed, so it cannot be immutable:
# a future font swap at the same path has to be able to propagate. Thirty days
# is long enough to stop the repeat fetches and short enough to recover.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# pdf.js image decoders (JBIG2 / CCITT G4 / JPEG 2000), fetched on demand the
# first time a scanned PDF is opened. Like /fonts/ these cannot be immutable —
# pdf.js addresses them by fixed name, so a pdfjs-dist upgrade rewrites the bytes
# behind the same URL and needs a way to propagate.
[[headers]]
  for = "/pdfjs-wasm/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Plain-text agent surfaces. Netlify already infers text/plain for .txt, but the
# charset is declared explicitly so a non-UTF-8 default can never mangle them.
[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/llms-full.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/index.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

# The agent card has to be readable cross-origin, otherwise an agent running in
# a browser context is blocked from the one file that identifies this site.
[[headers]]
  for = "/.well-known/*"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=3600"
